global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-products'
    metrics_path: '/actuator/prometheus'
    authorization:
      credentials: read-only-key
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'spring-boot-inventory'
    metrics_path: '/actuator/prometheus'
    authorization:
      credentials: read-only-key
    static_configs:
      - targets: ['host.docker.internal:8081']
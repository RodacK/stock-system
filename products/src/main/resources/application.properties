spring.application.name=products
server.port=8082

spring.datasource.url=${PRODUCTS_DB_URL}
spring.datasource.username=${PRODUCTS_DB_USERNAME}
spring.datasource.password=${PRODUCTS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Flyway
logging.level.org.flywaydb=DEBUG
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${PRODUCTS_DB_URL}
spring.flyway.user=${PRODUCTS_DB_USERNAME}
spring.flyway.password=${PRODUCTS_DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true

app.security.api-keys.read-only-key=PRODUCTS_READ
app.security.api-keys.admin-key=PRODUCTS_READ,PRODUCTS_WRITE

# HikariCP - connection pool timeouts
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.socketTimeout=30

# Tomcat - inbound request read timeout
server.tomcat.connection-timeout=5000

# Rate Limiter
resilience4j.ratelimiter.instances.products-read.limit-for-period=100
resilience4j.ratelimiter.instances.products-read.limit-refresh-period=10s
resilience4j.ratelimiter.instances.products-read.timeout-duration=0s
resilience4j.ratelimiter.instances.products-write.limit-for-period=20
resilience4j.ratelimiter.instances.products-write.limit-refresh-period=10s
resilience4j.ratelimiter.instances.products-write.timeout-duration=0s
management.health.ratelimiters.enabled=true
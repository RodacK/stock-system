spring.application.name=inventory
server.port=8081

spring.datasource.url=${INVENTORY_DB_URL}
spring.datasource.username=${INVENTORY_DB_USERNAME}
spring.datasource.password=${INVENTORY_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${INVENTORY_DB_URL}
spring.flyway.user=${INVENTORY_DB_USERNAME}
spring.flyway.password=${INVENTORY_DB_PASSWORD}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Springdoc / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true

# Security
app.security.api-keys.read-only-key=INVENTORY_READ
app.security.api-keys.admin-key=INVENTORY_READ,INVENTORY_WRITE

# Products service
app.products.base-url=${PRODUCTS_BASE_URL:http://localhost:8082}
app.products.api-key=${PRODUCTS_API_KEY:read-only-key}
app.products.connect-timeout=2s
app.products.read-timeout=3s

# Rate Limiter
resilience4j.ratelimiter.instances.inventory-read.limit-for-period=100
resilience4j.ratelimiter.instances.inventory-read.limit-refresh-period=10s
resilience4j.ratelimiter.instances.inventory-read.timeout-duration=0s
resilience4j.ratelimiter.instances.inventory-write.limit-for-period=20
resilience4j.ratelimiter.instances.inventory-write.limit-refresh-period=10s
resilience4j.ratelimiter.instances.inventory-write.timeout-duration=0s
management.health.ratelimiters.enabled=true

# Resilience4j - Circuit Breaker
resilience4j.circuitbreaker.instances.products.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.products.sliding-window-size=10
resilience4j.circuitbreaker.instances.products.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.products.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.products.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.products.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.products.register-health-indicator=true

# Resilience4j - Retry
resilience4j.retry.instances.products.max-attempts=3
resilience4j.retry.instances.products.wait-duration=500ms
resilience4j.retry.instances.products.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.retry.instances.products.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# Actuator - circuit breaker health
management.health.circuitbreakers.enabled=true

# Resilience4j - TimeLimiter (upper-bound for async-wrapped calls; pairs with read-timeout for sync)
resilience4j.timelimiter.instances.products.timeout-duration=5s
resilience4j.timelimiter.instances.products.cancel-running-future=true

# HikariCP - connection pool timeouts
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.socketTimeout=30

# Tomcat - inbound request read timeout
server.tomcat.connection-timeout=5000